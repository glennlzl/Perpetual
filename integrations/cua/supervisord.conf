[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:vnc-desktop]
command=/opt/desktop/start.sh
user=perpetual
environment=HOME="/home/perpetual",USER="perpetual",DISPLAY=":1",RESOLUTION="1280x800"
autorestart=true
startsecs=8
priority=10

[program:computer-server]
command=/opt/computer-server/venv/bin/python -m computer_server --host 127.0.0.1 --port 8000
user=perpetual
environment=HOME="/home/perpetual",USER="perpetual",DISPLAY=":1",XAUTHORITY="/home/perpetual/.Xauthority",PYTHONUNBUFFERED="1"
autorestart=true
startsecs=2
priority=20

[program:novnc]
command=/opt/computer-server/venv/bin/python -m websockify --web /opt/noVNC 127.0.0.1:6080 127.0.0.1:5901
user=perpetual
environment=HOME="/home/perpetual"
autorestart=true
startsecs=2
priority=20
