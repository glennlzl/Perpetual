# Builds the interface and runs the Node and Python browser runtime tests, drives the Python worker through the real
# controller, and type-checks and tests the repair-agent bench, which imports the product's repair modules. Tests that
# need Docker skip unless PERPETUAL_DOCKER_TESTS=1 (twins), PERPETUAL_REPAIR_DOCKER_TESTS=1 (the repair box) or
# BENCH_DOCKER=1 (the bench's boxes) is set, so no job starts containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Playwright journey tests run a real headless Chromium from the pinned @playwright/test.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
        id: node-tests
        env:
          PERPETUAL_PLAYWRIGHT_DIAGNOSTICS_DIR: ${{ runner.temp }}/perpetual-playwright-diagnostics
      # Lifecycle facts only: no pages, URLs, network bodies, credentials or videos.
      # actions/upload-artifact v7
      - name: Keep failed browser lifecycle evidence
        if: failure() && steps.node-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-lifecycle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perpetual-playwright-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 7

  browser-runtime:
    name: Browser runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
          cache-dependency-glob: integrations/browser-use/uv.lock
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv run --project integrations/browser-use --frozen python -m playwright install --with-deps chromium
      # The owned Chromium keeps its sandbox. The runner image restricts the unprivileged
      # user namespaces that sandbox needs, so lift the restriction on this disposable runner.
      - name: Allow the Chromium sandbox
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - run: npm run test:browser
      # The real controller drives this worker: discovery end to end against a disposable page and a deterministic
      # model, then the runtime tests that skip without the worker, which must not skip here.
      - run: node scripts/browser-agent-contract.ts
      - name: Runtime tests with the real worker
        # Naming bash adds pipefail, so a failing test fails the step through tee; the default shell runs without it.
        shell: bash
        run: |
          node --test --test-reporter=tap test/browser-runtime.test.ts | tee "$RUNNER_TEMP/browser-runtime.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/browser-runtime.tap"

  bench:
    name: Repair bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bench/repair
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bench/repair/package-lock.json
            bench/repair/adapters/pi/package-lock.json
      # The product modules the bench imports resolve their own dependencies from the root install.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm ci --prefix adapters/pi
      - run: npm run typecheck
      - run: npm test
