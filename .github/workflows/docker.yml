# Runs the tests that start Docker containers, which CI's jobs skip, against the runner's Docker Engine every night and
# on demand. It never runs for a pull request or a push, so it is not a required check. That native Linux engine routes
# no container to the host's loopback, so the twin tests' parts that need Docker Desktop skip with setup's note; any other
# skip fails the job, as a failed test does.
name: Docker tests

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Docker tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The log rotation test starts the twins' app image without pulling it.
      - name: Pull the twins' app image
        run: docker pull "$(node --input-type=module -e "console.log((await import('./src/twin/compose.ts')).APP_IMAGE)")"
      - name: Docker tests
        env:
          PERPETUAL_DOCKER_TESTS: "1"
          PERPETUAL_REPAIR_DOCKER_TESTS: "1"
        # Naming bash adds pipefail, so a failing test fails the step through tee. One file at a time: twins and Supabase
        # stacks of different files take ports from the same ranges.
        shell: bash
        run: |
          node --test --test-concurrency=1 --test-reporter=tap test/*-docker.test.ts | tee "$RUNNER_TEMP/docker.tap"
          if grep '# SKIP' "$RUNNER_TEMP/docker.tap" | grep -v 'Twins need Docker Desktop'; then exit 1; fi
          grep -q '^# pass [1-9]' "$RUNNER_TEMP/docker.tap"
